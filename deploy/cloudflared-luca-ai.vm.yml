# Fragmento de ingress para o Tunnel luca-ai-production na sennin.
# O Express escuta so em 127.0.0.1:4242; o proxy de borda (Workers VPC) e/ou
# o hostname publico abaixo entregam o trafego. Sem hostnames de outros projetos.
  - hostname: luca-ai.com.br
    service: http://127.0.0.1:4242
    originRequest:
      connectTimeout: 10s
      tcpKeepAlive: 30s
      keepAliveTimeout: 90s
      keepAliveConnections: 100
