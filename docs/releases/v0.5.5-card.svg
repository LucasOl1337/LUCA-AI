<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1011" font-family="Liberation Sans, sans-serif"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#160D31"/><stop offset="1" stop-color="#28184D"/></linearGradient></defs><rect width="1200" height="1011" fill="url(#bg)"/><text x="56" y="90" font-size="43" fill="#F8F5FF" font-weight="700">LUCA-AI</text><text x="56" y="138" font-size="25" fill="#D8C4EA" font-weight="700">NOTAS DA ATUALIZAÇÃO · v0.5.5</text><text x="970" y="88" font-size="18" fill="#BCB1D2" font-weight="400">19 SET 2026</text><path d="M56 174H1144" stroke="#76638C" opacity=".5"/><rect x="56" y="202" width="6" height="28" rx="3" fill="#2DD29A"/><text x="80" y="225" font-size="26" fill="#2DD29A" font-weight="700">MELHORIAS</text><text x="1040" y="225" font-size="20" fill="#BCB1D2" font-weight="400">2 itens</text><text x="80" y="281" font-size="27" fill="#F8F5FF" font-weight="700">Paisagem rural com assets licenciados</text><text x="80" y="315" font-size="23" fill="#BCB1D2" font-weight="400">Árvores, pasto, arbustos e céu HDR têm origem registrada.</text><text x="80" y="370" font-size="27" fill="#F8F5FF" font-weight="700">Caminhão e estrada mais detalhados</text><text x="80" y="404" font-size="23" fill="#BCB1D2" font-weight="400">Rodas, cabine, baú e iluminação foram refinados.</text><path d="M56 459H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="490" width="6" height="28" rx="3" fill="#30BCEF"/><text x="80" y="513" font-size="26" fill="#30BCEF" font-weight="700">CORREÇÕES</text><text x="1040" y="513" font-size="20" fill="#BCB1D2" font-weight="400">1 item</text><text x="80" y="569" font-size="27" fill="#F8F5FF" font-weight="700">Folhas e sombras consistentes</text><text x="80" y="603" font-size="23" fill="#BCB1D2" font-weight="400">Texturas mantêm a cobertura correta; o baú reduz marcas de sombra.</text><path d="M56 658H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="689" width="6" height="28" rx="3" fill="#AA88FA"/><text x="80" y="712" font-size="26" fill="#AA88FA" font-weight="700">SISTEMAS</text><text x="1040" y="712" font-size="20" fill="#BCB1D2" font-weight="400">1 item</text><text x="80" y="768" font-size="27" fill="#F8F5FF" font-weight="700">Cena conferida com dados sintéticos</text><text x="80" y="802" font-size="23" fill="#BCB1D2" font-weight="400">790 testes, typecheck, build e revisão visual em bancada isolada.</text><path d="M56 857H1144" stroke="#76638C" opacity=".35"/><text x="56" y="926" font-size="22" fill="#BCB1D2" font-weight="400">Notas completas e limites de validação no GitHub Releases.</text><text x="56" y="962" font-size="19" fill="#BCB1D2" font-weight="400">github.com/LucasOl1337/LUCA-AI/releases</text><path d="M28 70V28H70 M1130 28H1172V70 M28 941V983H70 M1130 983H1172V941" stroke="#A593BB" fill="none" opacity=".5"/></svg>