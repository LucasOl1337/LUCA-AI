<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1666" font-family="Liberation Sans, sans-serif"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#160D31"/><stop offset="1" stop-color="#28184D"/></linearGradient><linearGradient id="pill" x2="1"><stop stop-color="#C98E6B"/><stop offset="1" stop-color="#8E5CF0"/></linearGradient></defs><rect width="1200" height="1666" fill="url(#bg)"/><path d="M28 70V28H70" stroke="#76638C" fill="none" stroke-width="2"/><path d="M1172 70V28H1130" stroke="#76638C" fill="none" stroke-width="2"/><path d="M28 1596V1638H70" stroke="#76638C" fill="none" stroke-width="2"/><path d="M1172 1596V1638H1130" stroke="#76638C" fill="none" stroke-width="2"/><text x="56" y="90" font-size="43" fill="#F8F5FF" font-weight="700">LUCA-AI</text><rect x="252" y="56" width="116" height="44" rx="22" fill="url(#pill)"/><text x="310" y="86" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">v0.6.0</text><text x="1144" y="88" font-size="18" fill="#BCB1D2" text-anchor="end">22 OUT 2026</text><text x="56" y="138" font-size="22" fill="#F2D2A9" font-weight="700" letter-spacing="3">NOTAS DA ATUALIZAÇÃO · DESTAQUES</text><path d="M56 170H1144" stroke="#76638C" opacity=".5"/><text x="56" y="204" font-size="19" fill="#BCB1D2">Desde a v0.5.12 · totem do stand, cabine jogável, Trator MAX e CLI luca</text><rect x="56" y="235" width="6" height="28" rx="3" fill="#FFC61A"/><text x="80" y="258" font-size="26" fill="#FFC61A" font-weight="700" letter-spacing="2">NOVIDADES</text><text x="1144" y="258" font-size="19" fill="#BCB1D2" text-anchor="end">6 itens</text><circle cx="86" cy="312" r="5" fill="#FFC61A"/><text x="104" y="320" font-size="25" fill="#F8F5FF" font-weight="700">Totem do stand em tela cheia</text><text x="104" y="352" font-size="21" fill="#BCB1D2">Coruja, Vitrine e Simulação, por toque, texto ou voz.</text><circle cx="86" cy="384" r="5" fill="#FFC61A"/><text x="104" y="392" font-size="25" fill="#F8F5FF" font-weight="700">Coruja que conversa e opera o site</text><text x="104" y="424" font-size="21" fill="#BCB1D2">Voz escolhida, escuta discreta e ações com cursor visível.</text><circle cx="86" cy="456" r="5" fill="#FFC61A"/><text x="104" y="464" font-size="25" fill="#F8F5FF" font-weight="700">Dirigir o Trator MAX na cabine</text><text x="104" y="496" font-size="21" fill="#BCB1D2">Volante, fardo, pendente lateral e percurso guiado.</text><circle cx="86" cy="528" r="5" fill="#FFC61A"/><text x="104" y="536" font-size="25" fill="#F8F5FF" font-weight="700">Painel do operador ao vivo</text><text x="104" y="568" font-size="21" fill="#BCB1D2">Mapa, cards e alerta de sono acompanhando o totem.</text><circle cx="86" cy="600" r="5" fill="#FFC61A"/><text x="104" y="608" font-size="25" fill="#F8F5FF" font-weight="700">Cadastro de veículos</text><text x="104" y="640" font-size="21" fill="#BCB1D2">Aba Veículos liga o sensor do trator ao simulador.</text><circle cx="86" cy="672" r="5" fill="#FFC61A"/><text x="104" y="680" font-size="25" fill="#F8F5FF" font-weight="700">CLI luca para agentes</text><text x="104" y="712" font-size="21" fill="#BCB1D2">114 comandos cobrindo as 93 rotas HTTP.</text><path d="M56 740H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="749" width="6" height="28" rx="3" fill="#2DD29A"/><text x="80" y="772" font-size="26" fill="#2DD29A" font-weight="700" letter-spacing="2">MELHORIAS</text><text x="1144" y="772" font-size="19" fill="#BCB1D2" text-anchor="end">3 itens</text><circle cx="86" cy="826" r="5" fill="#2DD29A"/><text x="104" y="834" font-size="25" fill="#F8F5FF" font-weight="700">Coruja 3D refeita</text><text x="104" y="866" font-size="21" fill="#BCB1D2">Sem aspecto varrido, olhos pintados e bico sem rasgo.</text><circle cx="86" cy="898" r="5" fill="#2DD29A"/><text x="104" y="906" font-size="25" fill="#F8F5FF" font-weight="700">Cabine de fim de tarde</text><text x="104" y="938" font-size="21" fill="#BCB1D2">Volante e teto do Tripo, legenda PS5 e teclado.</text><circle cx="86" cy="970" r="5" fill="#2DD29A"/><text x="104" y="978" font-size="25" fill="#F8F5FF" font-weight="700">Qualidade automática</text><text x="104" y="1010" font-size="21" fill="#BCB1D2">O jogo baixa a qualidade quando o quadro passa de 20 ms.</text><path d="M56 1038H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="1047" width="6" height="28" rx="3" fill="#30BCEF"/><text x="80" y="1070" font-size="26" fill="#30BCEF" font-weight="700" letter-spacing="2">CORREÇÕES</text><text x="1144" y="1070" font-size="19" fill="#BCB1D2" text-anchor="end">2 itens</text><circle cx="86" cy="1124" r="5" fill="#30BCEF"/><text x="104" y="1132" font-size="25" fill="#F8F5FF" font-weight="700">Canal ao vivo não derruba o servidor</text><text x="104" y="1164" font-size="21" fill="#BCB1D2">Frame inválido não cai; reconexão sem F5.</text><circle cx="86" cy="1196" r="5" fill="#30BCEF"/><text x="104" y="1204" font-size="25" fill="#F8F5FF" font-weight="700">Microfone não trava ao ligar</text><text x="104" y="1236" font-size="21" fill="#BCB1D2">E o totem não grava avaliações de demonstração.</text><path d="M56 1264H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="1273" width="6" height="28" rx="3" fill="#AA88FA"/><text x="80" y="1296" font-size="26" fill="#AA88FA" font-weight="700" letter-spacing="2">SISTEMAS</text><text x="1144" y="1296" font-size="19" fill="#BCB1D2" text-anchor="end">2 itens</text><circle cx="86" cy="1350" r="5" fill="#AA88FA"/><text x="104" y="1358" font-size="25" fill="#F8F5FF" font-weight="700">Deploy sem página quebrada</text><text x="104" y="1390" font-size="21" fill="#BCB1D2">Cache de um ano, GLB em Brotli e recarga automática.</text><circle cx="86" cy="1422" r="5" fill="#AA88FA"/><text x="104" y="1430" font-size="25" fill="#F8F5FF" font-weight="700">Câmera ligada em produção</text><text x="104" y="1462" font-size="21" fill="#BCB1D2">Texto do produto pelo Astra High na Railway.</text><path d="M56 1490H1144" stroke="#76638C" opacity=".35"/><text x="56" y="1532" font-size="23" fill="#F2D2A9" font-weight="700">O LUCA-AI virou atração de feira: conversa, mostra e deixa dirigir.</text><text x="56" y="1571" font-size="19" fill="#BCB1D2">Notas completas, validações e limites no GitHub Releases.</text><text x="56" y="1606" font-size="16" fill="#9C8FB6">github.com/LucasOl1337/LUCA-AI/releases/tag/v0.6.0</text></svg>