<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1674" font-family="Liberation Sans, sans-serif"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#160D31"/><stop offset="1" stop-color="#28184D"/></linearGradient><linearGradient id="pill" x2="1"><stop stop-color="#C98E6B"/><stop offset="1" stop-color="#8E5CF0"/></linearGradient></defs><rect width="1200" height="1674" fill="url(#bg)"/><path d="M28 70V28H70" stroke="#76638C" fill="none" stroke-width="2"/><path d="M1172 70V28H1130" stroke="#76638C" fill="none" stroke-width="2"/><path d="M28 1604V1646H70" stroke="#76638C" fill="none" stroke-width="2"/><path d="M1172 1604V1646H1130" stroke="#76638C" fill="none" stroke-width="2"/><text x="56" y="90" font-size="43" fill="#F8F5FF" font-weight="700">LUCA-AI</text><rect x="252" y="56" width="116" height="44" rx="22" fill="url(#pill)"/><text x="310" y="86" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">v0.5.11</text><text x="1144" y="88" font-size="18" fill="#BCB1D2" font-weight="400" text-anchor="end">25 SET 2026</text><text x="56" y="138" font-size="22" fill="#F2D2A9" font-weight="700" letter-spacing="3">NOTAS DA ATUALIZAÇÃO · DESTAQUES</text><path d="M56 170H1144" stroke="#76638C" opacity=".5"/><text x="56" y="204" font-size="19" fill="#BCB1D2" font-weight="400">Primeiro release desde a v0.5.5 · reúne 0.5.6 a 0.5.10 e o trabalho até 25/09</text><rect x="56" y="235" width="6" height="28" rx="3" fill="#FFC61A"/><text x="80" y="258" font-size="26" fill="#FFC61A" font-weight="700" letter-spacing="2">NOVIDADES</text><text x="1144" y="258" font-size="19" fill="#BCB1D2" font-weight="400" text-anchor="end">4 itens</text><circle cx="86" cy="312" r="5" fill="#FFC61A"/><text x="104" y="320" font-size="25" fill="#F8F5FF" font-weight="700">Laboratório do sensor em /sensor</text><text x="104" y="352" font-size="21" fill="#BCB1D2" font-weight="400">Bancada 3D abre o acelerômetro do ESP32 manobra a manobra.</text><circle cx="86" cy="384" r="5" fill="#FFC61A"/><text x="104" y="392" font-size="25" fill="#F8F5FF" font-weight="700">Caminhão cara-chata brasileiro</text><text x="104" y="424" font-size="21" fill="#BCB1D2" font-weight="400">Cavalo 6x2 com baú frigorífico no lugar do bicudo americano.</text><circle cx="86" cy="456" r="5" fill="#FFC61A"/><text x="104" y="464" font-size="25" fill="#F8F5FF" font-weight="700">Rodovia rural refeita</text><text x="104" y="496" font-size="21" fill="#BCB1D2" font-weight="400">Sítio, posteação, gado nelore, talhões e eucaliptal.</text><circle cx="86" cy="528" r="5" fill="#FFC61A"/><text x="104" y="536" font-size="25" fill="#F8F5FF" font-weight="700">GPT-6 e Grok 4.7 no catálogo</text><text x="104" y="568" font-size="21" fill="#BCB1D2" font-weight="400">Novos modelos disponíveis para as personas.</text><path d="M56 598H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="607" width="6" height="28" rx="3" fill="#2DD29A"/><text x="80" y="630" font-size="26" fill="#2DD29A" font-weight="700" letter-spacing="2">MELHORIAS</text><text x="1144" y="630" font-size="19" fill="#BCB1D2" font-weight="400" text-anchor="end">4 itens</text><circle cx="86" cy="684" r="5" fill="#2DD29A"/><text x="104" y="692" font-size="25" fill="#F8F5FF" font-weight="700">Colheita com lavoura madura</text><text x="104" y="724" font-size="21" fill="#BCB1D2" font-weight="400">A colheitadeira colhe palha seca dourada, não verde.</text><circle cx="86" cy="756" r="5" fill="#2DD29A"/><text x="104" y="764" font-size="25" fill="#F8F5FF" font-weight="700">Fazenda com vizinhança</text><text x="104" y="796" font-size="21" fill="#BCB1D2" font-weight="400">Talhões vizinhos, mata de cerrado e sombra de nuvem.</text><circle cx="86" cy="828" r="5" fill="#2DD29A"/><text x="104" y="836" font-size="25" fill="#F8F5FF" font-weight="700">Noite que parece noite</text><text x="104" y="868" font-size="21" fill="#BCB1D2" font-weight="400">Fundo escuro; faróis e giroflex mandam na imagem.</text><circle cx="86" cy="900" r="5" fill="#2DD29A"/><text x="104" y="908" font-size="25" fill="#F8F5FF" font-weight="700">Sonolência calibrada em Full HD</text><text x="104" y="940" font-size="21" fill="#BCB1D2" font-weight="400">Olhos de 0% a 100% e webcam a 1920×1080.</text><path d="M56 970H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="979" width="6" height="28" rx="3" fill="#30BCEF"/><text x="80" y="1002" font-size="26" fill="#30BCEF" font-weight="700" letter-spacing="2">CORREÇÕES</text><text x="1144" y="1002" font-size="19" fill="#BCB1D2" font-weight="400" text-anchor="end">3 itens</text><circle cx="86" cy="1056" r="5" fill="#30BCEF"/><text x="104" y="1064" font-size="25" fill="#F8F5FF" font-weight="700">Chuva sem mata recortada</text><text x="104" y="1096" font-size="21" fill="#BCB1D2" font-weight="400">Some a faixa escura que flutuava no horizonte.</text><circle cx="86" cy="1128" r="5" fill="#30BCEF"/><text x="104" y="1136" font-size="25" fill="#F8F5FF" font-weight="700">Alerta de sonolência em 1 segundo</text><text x="104" y="1168" font-size="21" fill="#BCB1D2" font-weight="400">Sem perder a contagem por um frame marginal.</text><circle cx="86" cy="1200" r="5" fill="#30BCEF"/><text x="104" y="1208" font-size="25" fill="#F8F5FF" font-weight="700">Equipe e investigação destravadas</text><text x="104" y="1240" font-size="21" fill="#BCB1D2" font-weight="400">Persona oculta não trava preset; JSON com prosa é aceito.</text><path d="M56 1270H1144" stroke="#76638C" opacity=".35"/><rect x="56" y="1279" width="6" height="28" rx="3" fill="#AA88FA"/><text x="80" y="1302" font-size="26" fill="#AA88FA" font-weight="700" letter-spacing="2">SISTEMAS</text><text x="1144" y="1302" font-size="19" fill="#BCB1D2" font-weight="400" text-anchor="end">2 itens</text><circle cx="86" cy="1356" r="5" fill="#AA88FA"/><text x="104" y="1364" font-size="25" fill="#F8F5FF" font-weight="700">Modelos 3D 44% menores</text><text x="104" y="1396" font-size="21" fill="#BCB1D2" font-weight="400">GLB pré-comprimido em Brotli: 37,9 → 21,3 MB.</text><circle cx="86" cy="1428" r="5" fill="#AA88FA"/><text x="104" y="1436" font-size="25" fill="#F8F5FF" font-weight="700">Custo por quadro medido</text><text x="104" y="1468" font-size="21" fill="#BCB1D2" font-weight="400">A/B contra a v0.5.10: −0,9 a 0,0 ms em 8 cenários.</text><path d="M56 1498H1144" stroke="#76638C" opacity=".35"/><text x="56" y="1548" font-size="22" fill="#F2D2A9" font-weight="700">Um SOMPO com cara de Brasil, medido quadro a quadro.</text><text x="56" y="1586" font-size="19" fill="#BCB1D2" font-weight="400">Notas completas, validações e limites no GitHub Releases.</text><text x="56" y="1618" font-size="17" fill="#9C8FB5" font-weight="400">github.com/LucasOl1337/LUCA-AI/releases/tag/v0.5.11</text></svg>